<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>UNNAMED-GT — YouTube Intro Pack (Preview)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/intro.css" />
<style>
  /* Preview-harness-only chrome. Everything the intro itself needs lives in css/. */
  body { background: #000; font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
  .hud {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(20, 20, 24, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(16px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
  }
  .hud button, .hud select {
    font: 600 13px/1 -apple-system, "Segoe UI", Arial, sans-serif;
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .hud button:hover, .hud select:hover { background: rgba(255, 30, 50, 0.25); border-color: #ff1e32; }
  .hud .time { min-width: 64px; text-align: center; color: #ffb3bc; font-variant-numeric: tabular-nums; }
  /* ?capture=1 (set automatically by export/capture-frames.mjs) hides the
     preview-only HUD so it never gets baked into rendered frames. */
  body.capture-mode .hud { display: none; }
</style>
</head>
<body>

<div class="intro-viewport">
  <div class="intro-stage" data-aspect="9:16">
    <div class="intro-stage__sheen"></div>
    <div class="intro-brand">
      <span class="intro-brand__mark"></span>
      <span class="intro-brand__name"></span>
    </div>
    <!-- scene cards are injected here at runtime by js/intro.js -->
  </div>
</div>

<div class="hud">
  <button id="btn-replay" title="Restart the 8s intro">⟲ Replay</button>
  <button id="btn-pause" title="Pause / resume">⏸</button>
  <span class="time" id="hud-time">0.0s</span>
  <select id="select-aspect" title="Switch canvas aspect ratio">
    <option value="9:16" selected>9:16 (Shorts / Reels)</option>
    <option value="16:9">16:9 (Widescreen)</option>
  </select>
</div>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/config.js"></script>
<script type="module" src="js/intro.js"></script>
<script type="module">
  document.addEventListener("intropack:ready", () => {
    const { play, pause, restart, timeline, setAspect } = window.IntroPack;
    play();

    const pauseBtn = document.getElementById("btn-pause");
    document.getElementById("btn-replay").addEventListener("click", restart);
    pauseBtn.addEventListener("click", () => {
      if (timeline.paused()) { timeline.play(); pauseBtn.textContent = "⏸"; }
      else { timeline.pause(); pauseBtn.textContent = "▶"; }
    });
    document.getElementById("select-aspect").addEventListener("change", (e) => setAspect(e.target.value));

    const hudTime = document.getElementById("hud-time");
    gsap.ticker.add(() => { hudTime.textContent = timeline.time().toFixed(1) + "s"; });
  });
</script>
</body>
</html>
